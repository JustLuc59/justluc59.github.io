<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MJ Codex</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="entete"></div>

  <main class="plan plan--codex">
    <section class="panneau panneau--liste" id="panneau-liste" aria-label="Fiches"></section>
    <section class="panneau panneau--fiche" id="panneau-fiche" aria-label="Fiche"></section>
  </main>

  <section class="combat" id="panneau-vilains" aria-label="Registre des vilains" hidden></section>

  <dialog id="import" class="dialogue dialogue--large">
    <form id="form-import" class="dialogue-corps">
      <h2>Importer un stat block</h2>
      <p class="indice">Colle un bloc du SRD (français ou anglais) ou tes propres notes. La fiche Monstre s’ouvre en édition pour vérifier.</p>
      <textarea class="champ champ--zone champ--mono" name="texte" rows="16" placeholder="Gobelin
Humanoïde (gobelinoïde) de taille P, neutre mauvais
Classe d'armure 15 (armure de cuir, bouclier)
Points de vie 7 (2d6)
…" required></textarea>
      <div class="fiche-actions">
        <button class="bouton bouton--plein" type="submit">Créer la fiche</button>
        <button class="bouton" type="button" id="fermer-import">Fermer</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/pages/codex.js"></script>
</body>
</html>
